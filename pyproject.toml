[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ultra"
version = "1.0.0"
description = "Autonomous Frontier Mathematics and Physics Research Agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AgentUltra Team"},
]

dependencies = [
    "pyyaml>=6.0",
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]
numerical = [
    "jax>=0.4",
    "jaxlib>=0.4",
]

[project.scripts]
agent-ultra = "agent_ultra.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
